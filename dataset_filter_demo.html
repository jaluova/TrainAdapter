<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GridGround 数据集筛选演示</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:#0f0f1a;color:#e0e0e0;min-height:100vh}

.header{text-align:center;padding:36px 20px 20px;background:linear-gradient(180deg,#1a1a2e,#0f0f1a)}
.header h1{font-size:2rem;background:linear-gradient(135deg,#667eea,#764ba2,#f093fb);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:6px}
.header p{color:#888;font-size:.9rem;max-width:600px;margin:0 auto;line-height:1.6}

.container{max-width:1100px;margin:0 auto;padding:20px}

/* Input area */
.input-section{background:#1a1a2e;border:1px solid #2a2a3e;border-radius:16px;padding:24px;margin-bottom:20px}
.input-section h2{font-size:1.1rem;margin-bottom:16px;color:#ccc}
.input-row{display:flex;gap:12px;margin-bottom:12px;align-items:center;flex-wrap:wrap}
.input-row input{flex:1;min-width:200px;padding:10px 16px;border-radius:10px;border:1px solid #333;background:#14141e;color:#e0e0e0;font-size:.95rem;outline:none;transition:border .2s}
.input-row input:focus{border-color:#667eea}
.input-row select{padding:10px 12px;border-radius:10px;border:1px solid #333;background:#14141e;color:#e0e0e0;font-size:.9rem;outline:none}
.btn{padding:10px 20px;border-radius:10px;border:none;font-size:.9rem;font-weight:600;cursor:pointer;transition:all .2s}
.btn-primary{background:linear-gradient(135deg,#667eea,#764ba2);color:#fff}
.btn-primary:hover{opacity:.9;transform:translateY(-1px)}
.btn-secondary{background:#2a2a3e;color:#ccc;border:1px solid #3a3a4e}
.btn-secondary:hover{background:#3a3a4e}
.btn-danger{background:rgba(239,83,80,.15);color:#ef9a9a;border:1px solid rgba(239,83,80,.3)}

/* Pipeline visualization */
.pipeline{display:flex;align-items:stretch;gap:0;margin:24px 0;overflow-x:auto;padding-bottom:8px}
.pipe-stage{flex:1;min-width:140px;padding:16px 12px;text-align:center;position:relative;border:1px solid #2a2a3e;background:#14141e}
.pipe-stage:first-child{border-radius:12px 0 0 12px}
.pipe-stage:last-child{border-radius:0 12px 12px 0}
.pipe-stage::after{content:'';position:absolute;right:-1px;top:50%;transform:translateY(-50%);width:0;height:0;border-top:10px solid transparent;border-bottom:10px solid transparent;border-left:10px solid #2a2a3e;z-index:1}
.pipe-stage:last-child::after{display:none}
.pipe-stage .stage-label{font-size:.72rem;color:#888;text-transform:uppercase;letter-spacing:1px;margin-bottom:6px}
.pipe-stage .stage-count{font-size:1.6rem;font-weight:800}
.pipe-stage .stage-desc{font-size:.78rem;color:#999;margin-top:4px}
.pipe-stage.active{background:#1a1a2e;border-color:#667eea}

/* Results */
.results{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:20px}
@media(max-width:700px){.results{grid-template-columns:1fr}}

.result-card{background:#1a1a2e;border:1px solid #2a2a3e;border-radius:12px;padding:20px;position:relative;overflow:hidden}
.result-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px}
.result-card h3{font-size:.95rem;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.result-card .tag{display:inline-block;padding:2px 10px;border-radius:8px;font-size:.75rem;font-weight:600}

/* Category colors */
.cat-ordinal{color:#ef9a9a}.cat-ordinal .tag{background:rgba(239,83,80,.15);color:#ef9a9a;border:1px solid rgba(239,83,80,.3)}
.result-card.cat-ordinal::before{background:linear-gradient(90deg,#ef5350,#ff7043)}
.cat-spatial{color:#9fa8da}.cat-spatial .tag{background:rgba(102,126,234,.15);color:#9fa8da;border:1px solid rgba(102,126,234,.3)}
.result-card.cat-spatial::before{background:linear-gradient(90deg,#667eea,#764ba2)}
.cat-multi{color:#81d4fa}.cat-multi .tag{background:rgba(79,195,247,.15);color:#81d4fa;border:1px solid rgba(79,195,247,.3)}
.result-card.cat-multi::before{background:linear-gradient(90deg,#4fc3f7,#29b6f6)}
.cat-easy{color:#81c784}.cat-easy .tag{background:rgba(102,187,106,.15);color:#81c784;border:1px solid rgba(102,187,106,.3)}
.result-card.cat-easy::before{background:linear-gradient(90deg,#66bb6a,#43a047)}
.cat-color-tag{color:#ffd54f}

/* Sample list */
.sample-list{max-height:400px;overflow-y:auto;margin-top:12px}
.sample-item{padding:10px 12px;border-radius:8px;margin-bottom:6px;font-size:.88rem;display:flex;justify-content:space-between;align-items:center;gap:8px;transition:background .15s}
.sample-item:hover{background:rgba(255,255,255,.04)}
.sample-query{flex:1;word-break:break-all}
.sample-badges{display:flex;gap:4px;flex-shrink:0}
.badge-sm{padding:1px 8px;border-radius:6px;font-size:.7rem;font-weight:600}
.badge-color{background:rgba(255,213,79,.12);color:#ffd54f;border:1px solid rgba(255,213,79,.25)}
.badge-relation{background:rgba(102,126,234,.12);color:#9fa8da;border:1px solid rgba(102,126,234,.25)}
.badge-filtered{background:rgba(239,83,80,.12);color:#ef9a9a;border:1px solid rgba(239,83,80,.25);text-decoration:line-through}
.badge-weight{background:rgba(255,255,255,.06);color:#aaa;border:1px solid rgba(255,255,255,.1);font-family:"SF Mono","Fira Code",monospace}

/* Highlight matched keywords */
.kw-hit{padding:1px 4px;border-radius:4px;font-weight:700}
.kw-ordinal{background:rgba(239,83,80,.2);color:#ef9a9a}
.kw-relation{background:rgba(102,126,234,.2);color:#9fa8da}
.kw-multi{background:rgba(79,195,247,.2);color:#81d4fa}
.kw-color{background:rgba(255,213,79,.2);color:#ffd54f}

/* Detail panel */
.detail-panel{background:#14141e;border:1px solid #2a2a3e;border-radius:12px;padding:20px;margin-top:20px}
.detail-panel h3{margin-bottom:12px;font-size:1rem}
.detail-row{display:flex;gap:8px;margin-bottom:8px;font-size:.88rem;align-items:baseline}
.detail-label{color:#888;min-width:120px;flex-shrink:0}
.detail-value{color:#ccc}

/* Flow explanation */
.flow-explain{background:#1a1a2e;border:1px solid #2a2a3e;border-radius:12px;padding:20px;margin-top:20px}
.flow-explain h3{margin-bottom:12px;font-size:1rem;color:#ddd}
.flow-step{display:flex;gap:12px;margin-bottom:10px;padding:8px 12px;border-radius:8px;font-size:.88rem}
.flow-step.hit{background:rgba(102,126,234,.08)}
.flow-step.miss{opacity:.4}
.flow-step.filtered{background:rgba(239,83,80,.08)}
.step-num{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.75rem;font-weight:700;flex-shrink:0}
.step-num.yes{background:rgba(102,187,106,.2);color:#81c784}
.step-num.no{background:rgba(255,255,255,.06);color:#666}
.step-num.block{background:rgba(239,83,80,.2);color:#ef9a9a}
.step-text{line-height:1.5}

/* Stats bar */
.stats-bar{display:flex;gap:12px;margin:16px 0;flex-wrap:wrap}
.stat-chip{padding:6px 14px;border-radius:8px;font-size:.82rem;background:#14141e;border:1px solid #2a2a3e}
.stat-chip b{margin-right:4px}

/* Presets */
.presets{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.preset-btn{padding:6px 14px;border-radius:8px;font-size:.82rem;cursor:pointer;background:#1a1a2e;border:1px solid #2a2a3e;color:#bbb;transition:all .15s}
.preset-btn:hover{border-color:#667eea;color:#ddd}

/* Toggle */
.toggle-row{display:flex;align-items:center;gap:10px;margin:12px 0}
.toggle{position:relative;width:44px;height:24px;cursor:pointer}
.toggle input{display:none}
.toggle .slider{position:absolute;inset:0;border-radius:12px;background:#333;transition:background .2s}
.toggle .slider::before{content:'';position:absolute;width:18px;height:18px;border-radius:50%;background:#ccc;top:3px;left:3px;transition:transform .2s}
.toggle input:checked+.slider{background:#667eea}
.toggle input:checked+.slider::before{transform:translateX(20px)}
</style>
</head>
<body>

<div class="header">
  <h1>数据集筛选演示</h1>
  <p>输入查询文本，实时查看分类结果、采样权重、以及是否被过滤。<br>完整复现 <code>dataset.py</code> 中的筛选逻辑。</p>
</div>

<div class="container">

  <!-- Input -->
  <div class="input-section">
    <h2>试试输入查询</h2>
    <div class="presets">
      <button class="preset-btn" onclick="setQuery('the red car on the left')">the red car on the left</button>
      <button class="preset-btn" onclick="setQuery('second person from left')">second person from left</button>
      <button class="preset-btn" onclick="setQuery('dog and cat')">dog and cat</button>
      <button class="preset-btn" onclick="setQuery('the tall building')">the tall building</button>
      <button class="preset-btn" onclick="setQuery('左边第二个穿红衣服的人')">左边第二个穿红衣服的人</button>
      <button class="preset-btn" onclick="setQuery('最右边的蓝色车')">最右边的蓝色车</button>
      <button class="preset-btn" onclick="setQuery('woman in blue between two men')">woman in blue between two men</button>
      <button class="preset-btn" onclick="setQuery('leftmost gray cat')">leftmost gray cat</button>
    </div>
    <div class="input-row">
      <input type="text" id="queryInput" placeholder="输入查询文本，如 'the red car on the left'" oninput="analyze()">
      <select id="imageSampleCount" onchange="analyze()">
        <option value="1">图片中 1 个标注</option>
        <option value="2">图片中 2+ 个标注</option>
      </select>
    </div>
    <div class="toggle-row">
      <label class="toggle">
        <input type="checkbox" id="filterOrdinal" checked onchange="analyze()">
        <span class="slider"></span>
      </label>
      <span style="font-size:.88rem;color:#bbb">filter_ordinal_queries（过滤顺序查询，默认开启）</span>
    </div>
  </div>

  <!-- Results -->
  <div id="resultArea"></div>

</div>

<script>
const RELATION_KEYWORDS = [
  'left','right','top','bottom','front','behind','between','with','and',
  'center','middle','near','nearest','closest','far','furthest',
  'first','second','third','fourth','last',
  '左','右','上','下','前','后','之间','旁边','附近','中间','中央','靠近','远离'
];
const ORDINAL_KEYWORDS = [
  'first','second','third','fourth','fifth','last',
  'leftmost','rightmost','furthest','nearest',
  '第一','第二','第三','第四','第五','最后','最左','最右','最远','最近'
];
const MULTI_ENTITY_KEYWORDS = [' and ',' with ',' between ',' beside ',' next to ','和','与','之间','旁边','边上'];
const COLOR_KEYWORDS = [
  'red','blue','green','yellow','black','white','brown','orange','purple','pink','gray','grey',
  '红','蓝','绿','黄','黑','白','棕','橙','紫','粉','灰'
];

const WEIGHTS = {spatial_relation:1.8, ordinal:2.2, multi_entity:2.0, easy_salient:1.0};
const RELATION_WEIGHT = 1.2;
const COLOR_WEIGHT = 1.3;
const MULTI_QUERY_IMAGE_WEIGHT = 1.3;

function isRelation(q) {
  const low = q.toLowerCase();
  return RELATION_KEYWORDS.filter(k => low.includes(k));
}
function isOrdinal(q) {
  const low = ' ' + q.toLowerCase() + ' ';
  return ORDINAL_KEYWORDS.filter(k => low.includes(k));
}
function isMultiEntity(q) {
  const low = ' ' + q.toLowerCase() + ' ';
  return MULTI_ENTITY_KEYWORDS.filter(k => low.includes(k));
}
function isColor(q) {
  const low = ' ' + q.toLowerCase() + ' ';
  return COLOR_KEYWORDS.filter(k => (' ' + k + ' ') !== '' && low.includes(' ' + k + ' '));
}

function classify(query, imageSampleCount) {
  if (isOrdinal(query).length > 0) return 'ordinal';
  if (isMultiEntity(query).length > 0) return 'multi_entity';
  if (isRelation(query).length > 0) return 'spatial_relation';
  if (imageSampleCount > 1) return 'multi_entity';
  return 'easy_salient';
}

function highlightKeywords(query, hits, cssClass) {
  let result = query;
  const sorted = [...hits].sort((a, b) => b.length - a.length);
  for (const kw of sorted) {
    const regex = new RegExp(`(${kw.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')})`, 'gi');
    result = result.replace(regex, `<span class="kw-hit ${cssClass}">$1</span>`);
  }
  return result;
}

function setQuery(q) {
  document.getElementById('queryInput').value = q;
  analyze();
}

function analyze() {
  const query = document.getElementById('queryInput').value.trim();
  const imageSampleCount = parseInt(document.getElementById('imageSampleCount').value);
  const filterOrdinal = document.getElementById('filterOrdinal').checked;
  const area = document.getElementById('resultArea');

  if (!query) {
    area.innerHTML = '';
    return;
  }

  const ordinalHits = isOrdinal(query);
  const multiHits = isMultiEntity(query);
  const relationHits = isRelation(query);
  const colorHits = isColor(query);

  const difficulty = classify(query, imageSampleCount);
  const isFiltered = filterOrdinal && difficulty === 'ordinal';
  const isColorQ = colorHits.length > 0;
  const isRelationQ = relationHits.length > 0;

  // Calculate weight
  let weight = 1.0;
  if (!isFiltered) {
    weight = Math.max(weight, WEIGHTS[difficulty] || 1.0);
    if (imageSampleCount > 1) weight = Math.max(weight, MULTI_QUERY_IMAGE_WEIGHT);
    if (isRelationQ) weight = Math.max(weight, RELATION_WEIGHT);
    if (isColorQ) weight = Math.max(weight, COLOR_WEIGHT);
  }

  // Build highlighted query
  let highlighted = query;
  // Apply highlights in order (ordinal > color > relation) so inner matches don't break
  // We'll do a simple version
  const allHits = [];
  for (const k of ordinalHits) allHits.push({kw:k, cls:'kw-ordinal'});
  for (const k of colorHits) allHits.push({kw:k, cls:'kw-color'});
  for (const k of multiHits) allHits.push({kw:k, cls:'kw-multi'});
  for (const k of relationHits) {
    if (!ordinalHits.includes(k)) allHits.push({kw:k, cls:'kw-relation'});
  }
  // Sort by length desc to avoid partial replacement issues
  allHits.sort((a,b) => b.kw.length - a.kw.length);
  const used = new Set();
  for (const {kw, cls} of allHits) {
    if (used.has(kw.toLowerCase())) continue;
    used.add(kw.toLowerCase());
    const regex = new RegExp(`(${kw.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')})`, 'gi');
    highlighted = highlighted.replace(regex, `<span class="kw-hit ${cls}">$1</span>`);
  }

  const catLabels = {
    ordinal: {name:'Ordinal 顺序查询', cls:'cat-ordinal', icon:'#'},
    multi_entity: {name:'Multi-Entity 多实体', cls:'cat-multi', icon:'&'},
    spatial_relation: {name:'Spatial Relation 空间关系', cls:'cat-spatial', icon:'\u2194'},
    easy_salient: {name:'Easy Salient 简单显著', cls:'cat-easy', icon:'\u2713'}
  };
  const cat = catLabels[difficulty];

  // Classification flow steps
  const steps = [
    {
      test: ordinalHits.length > 0,
      label: 'is_ordinal_query()',
      desc: `检查是否包含顺序关键词（加空格边界匹配）`,
      hits: ordinalHits,
      result: difficulty === 'ordinal' ? 'ordinal' : null
    },
    {
      test: multiHits.length > 0,
      label: 'is_multi_entity_query()',
      desc: `检查是否包含多实体关键词（加空格边界匹配）`,
      hits: multiHits,
      result: difficulty === 'multi_entity' && ordinalHits.length === 0 ? 'multi_entity' : null
    },
    {
      test: relationHits.length > 0,
      label: 'is_relation_query()',
      desc: `检查是否包含空间关系关键词（子串匹配）`,
      hits: relationHits.filter(k => !ordinalHits.includes(k)),
      result: difficulty === 'spatial_relation' ? 'spatial_relation' : null
    },
    {
      test: imageSampleCount > 1,
      label: 'image_sample_count > 1',
      desc: `同一张图有多个标注`,
      hits: [],
      result: difficulty === 'multi_entity' && ordinalHits.length === 0 && multiHits.length === 0 && relationHits.length === 0 ? 'multi_entity' : null
    },
    {
      test: difficulty === 'easy_salient',
      label: 'fallback',
      desc: `以上都不匹配，归为简单显著类`,
      hits: [],
      result: difficulty === 'easy_salient' ? 'easy_salient' : null
    }
  ];

  area.innerHTML = `
    <!-- Highlighted Query -->
    <div style="background:#1a1a2e;border:1px solid #2a2a3e;border-radius:12px;padding:20px;margin-bottom:16px">
      <div style="font-size:.78rem;color:#888;margin-bottom:8px">查询文本（关键词高亮）</div>
      <div style="font-size:1.2rem;line-height:1.8">${highlighted}</div>
      <div style="margin-top:12px;display:flex;gap:6px;flex-wrap:wrap">
        ${ordinalHits.length ? `<span class="badge-sm" style="background:rgba(239,83,80,.12);color:#ef9a9a;border:1px solid rgba(239,83,80,.25)">Ordinal: ${ordinalHits.join(', ')}</span>` : ''}
        ${colorHits.length ? `<span class="badge-sm badge-color">Color: ${colorHits.join(', ')}</span>` : ''}
        ${relationHits.filter(k=>!ordinalHits.includes(k)).length ? `<span class="badge-sm badge-relation">Relation: ${relationHits.filter(k=>!ordinalHits.includes(k)).join(', ')}</span>` : ''}
        ${multiHits.length ? `<span class="badge-sm" style="background:rgba(79,195,247,.12);color:#81d4fa;border:1px solid rgba(79,195,247,.25)">Multi: ${multiHits.join(', ')}</span>` : ''}
      </div>
    </div>

    <!-- Classification Flow -->
    <div class="flow-explain">
      <h3>classify_query_difficulty() 分类流程</h3>
      <div style="font-size:.82rem;color:#888;margin-bottom:12px">按优先级从上到下判断，第一个命中的即为最终分类</div>
      ${steps.map((s, i) => {
        const isHit = s.result !== null;
        const isBlock = isHit && isFiltered && s.result === 'ordinal';
        return `<div class="flow-step ${isBlock ? 'filtered' : isHit ? 'hit' : 'miss'}">
          <div class="step-num ${isBlock ? 'block' : isHit ? 'yes' : 'no'}">${isBlock ? '\u2717' : isHit ? '\u2713' : i+1}</div>
          <div class="step-text">
            <strong>${s.label}</strong>
            <span style="color:#888"> \u2014 ${s.desc}</span>
            ${s.hits.length ? `<br><span style="font-size:.82rem;color:#aaa">命中: <code>${s.hits.join(', ')}</code></span>` : ''}
            ${isHit ? `<br><span style="font-size:.82rem;color:${isBlock ? '#ef9a9a' : '#81c784'}"><strong>\u2192 ${isBlock ? '分类为 ordinal \u2192 被过滤!' : '分类为 ' + s.result}</strong></span>` : ''}
          </div>
        </div>`;
      }).join('')}
    </div>

    <!-- Result Summary -->
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-top:16px">
      <div class="result-card ${cat.cls}" style="text-align:center">
        <div style="font-size:.75rem;color:#888;margin-bottom:4px">难度分类</div>
        <div style="font-size:1.1rem;font-weight:700">${cat.name}</div>
        ${isFiltered ? '<div style="margin-top:8px"><span class="tag" style="background:rgba(239,83,80,.2);color:#ef9a9a;border:1px solid rgba(239,83,80,.4);font-size:.8rem">已过滤 (filter_ordinal_queries=True)</span></div>' : ''}
      </div>
      <div class="result-card" style="text-align:center;${isFiltered ? 'opacity:.3' : ''}">
        <div style="font-size:.75rem;color:#888;margin-bottom:4px">采样权重</div>
        <div style="font-size:1.8rem;font-weight:800;${isFiltered ? '' : weight > 1 ? 'color:#ffd54f' : 'color:#81c784'}">${isFiltered ? '\u2014' : weight.toFixed(1) + 'x'}</div>
        <div style="font-size:.78rem;color:#999;margin-top:4px">${isFiltered ? '不参与训练' : weight > 1 ? '过采样' : '正常采样'}</div>
      </div>
      <div class="result-card" style="text-align:center">
        <div style="font-size:.75rem;color:#888;margin-bottom:4px">附加标签</div>
        <div style="margin-top:8px;display:flex;gap:6px;justify-content:center;flex-wrap:wrap">
          ${isColorQ ? '<span class="badge-sm badge-color">is_color_query</span>' : ''}
          ${isRelationQ ? '<span class="badge-sm badge-relation">is_relation_query</span>' : ''}
          ${isOrdinal(query).length > 0 ? `<span class="badge-sm badge-filtered">is_ordinal_query</span>` : ''}
          ${!isColorQ && !isRelationQ && isOrdinal(query).length === 0 ? '<span style="color:#666;font-size:.85rem">无</span>' : ''}
        </div>
      </div>
    </div>

    <!-- Weight Calculation -->
    <div class="detail-panel">
      <h3>采样权重计算过程</h3>
      <div style="font-size:.82rem;color:#888;margin-bottom:12px">使用 <code>max()</code> 取各项中的最大值，而非累加</div>
      ${isFiltered ? '<div style="color:#ef9a9a;font-size:.9rem">此样本被过滤，不参与训练，无需计算权重</div>' : `
      <table style="width:100%;font-size:.88rem;border-collapse:collapse">
        <tr style="color:#888;border-bottom:1px solid #2a2a3e">
          <td style="padding:8px">来源</td><td style="padding:8px">条件</td><td style="padding:8px;text-align:right">权重</td>
        </tr>
        <tr style="border-bottom:1px solid #1a1a2e;${true ? 'color:#ccc' : 'color:#555'}">
          <td style="padding:8px">基础权重</td><td style="padding:8px">所有样本</td><td style="padding:8px;text-align:right">1.0</td>
        </tr>
        <tr style="border-bottom:1px solid #1a1a2e;${WEIGHTS[difficulty] > 1 ? 'color:#ffd54f' : 'color:#555'}">
          <td style="padding:8px">difficulty_oversample</td><td style="padding:8px">${difficulty} = ${WEIGHTS[difficulty] || 1.0}x</td><td style="padding:8px;text-align:right">${WEIGHTS[difficulty] > 1 ? WEIGHTS[difficulty] : '-'}</td>
        </tr>
        <tr style="border-bottom:1px solid #1a1a2e;${imageSampleCount > 1 ? 'color:#ffd54f' : 'color:#555'}">
          <td style="padding:8px">multi_query_image</td><td style="padding:8px">image_sample_count=${imageSampleCount} ${imageSampleCount > 1 ? '> 1' : '<= 1'}</td><td style="padding:8px;text-align:right">${imageSampleCount > 1 ? MULTI_QUERY_IMAGE_WEIGHT : '-'}</td>
        </tr>
        <tr style="border-bottom:1px solid #1a1a2e;${isRelationQ ? 'color:#ffd54f' : 'color:#555'}">
          <td style="padding:8px">relation_query_oversample</td><td style="padding:8px">${isRelationQ ? 'is_relation_query=True' : 'is_relation_query=False'}</td><td style="padding:8px;text-align:right">${isRelationQ ? RELATION_WEIGHT : '-'}</td>
        </tr>
        <tr style="border-bottom:1px solid #1a1a2e;${isColorQ ? 'color:#ffd54f' : 'color:#555'}">
          <td style="padding:8px">color_query_oversample</td><td style="padding:8px">${isColorQ ? 'is_color_query=True' : 'is_color_query=False'}</td><td style="padding:8px;text-align:right">${isColorQ ? COLOR_WEIGHT : '-'}</td>
        </tr>
        <tr style="font-weight:700;color:#ffd54f;border-top:2px solid #3a3a4e">
          <td style="padding:8px" colspan="2">max() = 最终权重</td><td style="padding:8px;text-align:right;font-size:1.1rem">${weight.toFixed(1)}x</td>
        </tr>
      </table>`}
    </div>

    <!-- Matching rules explanation -->
    <div class="detail-panel" style="margin-top:16px">
      <h3>匹配规则差异</h3>
      <div style="font-size:.85rem;line-height:1.8;color:#bbb">
        <table style="width:100%;border-collapse:collapse">
          <tr style="color:#888;border-bottom:1px solid #2a2a3e;font-size:.8rem">
            <td style="padding:8px 8px 8px 0">函数</td><td style="padding:8px">匹配方式</td><td style="padding:8px">示例</td>
          </tr>
          <tr style="border-bottom:1px solid #1a1a2e">
            <td style="padding:8px 8px 8px 0;color:#9fa8da"><code>is_relation_query</code></td>
            <td style="padding:8px"><strong>子串匹配</strong><br><code>keyword in query</code></td>
            <td style="padding:8px;font-size:.82rem;color:#999">"be<span class="kw-hit kw-relation">left</span>" 也会命中 "left"</td>
          </tr>
          <tr style="border-bottom:1px solid #1a1a2e">
            <td style="padding:8px 8px 8px 0;color:#ef9a9a"><code>is_ordinal_query</code></td>
            <td style="padding:8px"><strong>空格边界匹配</strong><br><code>keyword in " query "</code></td>
            <td style="padding:8px;font-size:.82rem;color:#999">"befirst" 不会命中，"the first" 会命中</td>
          </tr>
          <tr style="border-bottom:1px solid #1a1a2e">
            <td style="padding:8px 8px 8px 0;color:#81d4fa"><code>is_multi_entity</code></td>
            <td style="padding:8px"><strong>空格边界匹配</strong><br>同 ordinal</td>
            <td style="padding:8px;font-size:.82rem;color:#999">关键词自带空格如 " and "</td>
          </tr>
          <tr>
            <td style="padding:8px 8px 8px 0;color:#ffd54f"><code>is_color_query</code></td>
            <td style="padding:8px"><strong>双重空格匹配</strong><br><code>" keyword " in " query "</code></td>
            <td style="padding:8px;font-size:.82rem;color:#999">最严格："already" 不会命中 "red"</td>
          </tr>
        </table>
      </div>
    </div>
  `;
}

// Init with example
setQuery('the red car on the left');
</script>
</body>
</html>
